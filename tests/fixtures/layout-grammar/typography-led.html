<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fictional Studio | Editorial Cover</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #c8d2d9; font-family: Arial, sans-serif; }
    .page { position: relative; width: 800px; height: 600px; overflow: hidden;
      background: #101f36; color: #f8f0df; }
    .ribbon { position: absolute; top: 28px; left: 72px; font-size: 12px;
      font-weight: 700; letter-spacing: 5px; color: #dfb37b; }
    h1 { position: absolute; top: 114px; left: 72px; width: 650px; height: 166px;
      margin: 0; font-size: 80px; line-height: 0.96; letter-spacing: -5px;
      font-weight: 800; }
    p { position: absolute; top: 355px; left: 78px; width: 450px; height: 84px;
      margin: 0; font-size: 23px; line-height: 1.4; font-weight: 400; }
    .bottom-line { position: absolute; bottom: 57px; left: 72px; width: 655px;
      height: 3px; background: #dfb37b; }
    .page-number { position: absolute; bottom: 23px; right: 72px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="page" data-page-id="P1">
    <div class="ribbon">ORIGINAL FICTIONAL MATERIAL</div>
    <h1 data-grammar-element-id="title" data-grammar-rule-ids="heading-above-body">Ideas move<br>markets.</h1>
    <p data-grammar-element-id="copy" data-grammar-rule-ids="heading-above-body">A new perspective on making things matter.</p>
    <div class="bottom-line" aria-hidden="true"></div>
    <div class="page-number">01 / 08</div>
  </main>
</body>
</html>

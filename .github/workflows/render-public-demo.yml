name: Inspect fictional document rendering

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-document-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated renderer and open CJK fonts
        run: |
          npm install --prefix "$RUNNER_TEMP/document-studio-render" --no-package-lock --no-save playwright@1.56.1
          node "$RUNNER_TEMP/document-studio-render/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture the included fictional example
        run: |
          node <<'JS'
          const {chromium} = require(process.env.RUNNER_TEMP + '/document-studio-render/node_modules/playwright');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const {pathToFileURL} = require('node:url');
          (async () => {
            const source = 'skills/report-html-pptx/assets/accepted-staff-guide/index.html';
            const browser = await chromium.launch({headless: true});
            const page = await browser.newPage({viewport: {width: 1320, height: 1200}, deviceScaleFactor: 1});
            await page.goto(pathToFileURL(path.resolve(source)).href);
            await page.evaluate(() => document.fonts.ready);
            const sheet = page.locator('.sheet');
            if (await sheet.count() !== 1) throw new Error('Expected one fictional document sheet');
            const geometry = await sheet.evaluate(el => {
              const bounds = el.getBoundingClientRect();
              const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
              const clippedText = [];
              while (walker.nextNode()) {
                if (!walker.currentNode.textContent.trim()) continue;
                const range = document.createRange();
                range.selectNodeContents(walker.currentNode);
                for (const rect of range.getClientRects()) {
                  if (rect.width && (rect.left < bounds.left - 1 || rect.right > bounds.right + 1)) {
                    clippedText.push(walker.currentNode.textContent.trim().slice(0, 80));
                    break;
                  }
                }
              }
              return {sheetWidth: bounds.width, scrollWidth: el.scrollWidth, clippedText};
            });
            console.log(JSON.stringify(geometry));
            // Decorative pseudo-elements deliberately extend beyond the sheet; check text instead.
            if (geometry.clippedText.length) throw new Error('Example text extends outside the sheet');
            fs.mkdirSync('render-output', {recursive: true});
            await sheet.screenshot({path: 'render-output/document-example.png', animations: 'disabled'});
            fs.writeFileSync('render-output/document-example.json', JSON.stringify({
              source,
              source_sha256: crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex'),
              kind: 'Screenshot of an included independently authored fictional example; not a new generation benchmark',
              content: 'Fictional company and synthetic figures',
              viewport: {width: 1320, height: 1200},
              renderer: 'Playwright 1.56.1 / Chromium',
              fonts: 'System sans-serif with open Noto CJK fonts installed'
            }, null, 2) + '\n');
            await browser.close();
          })().catch(error => {console.error(error); process.exit(1)});
          JS
      - name: Upload screenshot for manual inspection
        uses: actions/upload-artifact@v4
        with:
          name: fictional-document-render
          path: render-output/

     .desc{font-size:12px;fill:#b6d1df}
     .small{font-size:12px;font-weight:700;fill:#f3fcff}
     .mini{font-size:10px;fill:#bed7e3}
     .panel{fill:#102940;stroke:#2a6071;stroke-opacity:.8}
     .line{stroke:#81a9c3;stroke-opacity:.52;stroke-width:5;stroke-linecap:round}
    </style>

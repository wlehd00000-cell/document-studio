<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Document Studio: Your documents, your rules, your AI plugin</title>
  <desc id="desc">An illustration showing reference documents, approved company rules, a tailored plugin, and a new document.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D172A"/><stop offset="0.58" stop-color="#172947"/><stop offset="1" stop-color="#0B2634"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#66F2D6"/><stop offset="1" stop-color="#37B9D3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="11" stdDeviation="13" flood-color="#050A13" flood-opacity="0.35"/></filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#A8D4F4" stroke-opacity="0.065"/></pattern>

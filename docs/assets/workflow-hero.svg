    <linearGradient id="page" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dbeef0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="23"/></filter>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#010a15" flood-opacity=".45"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#5bdddf" fill-opacity=".13"/></pattern>
    <style>

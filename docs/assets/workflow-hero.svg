  <text x="45" y="126" fill="#FFFFFF" font-family="Inter,Arial,sans-serif" font-weight="750" font-size="31">Your documents. Your rules. Your AI plugin.</text>
  <text x="45" y="154" fill="#AFCAE0" font-family="Inter,Arial,sans-serif" font-size="15">Give it approved references, review what it learns, then make new documents in your style.</text>

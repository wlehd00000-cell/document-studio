<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Document Studio — consistent company standards across changing AI workflows</title>
  <desc id="hero-desc">Illustrative five-step process: approved references, style analysis, human review, custom plugin packaging, and a newly authored business document. Not a software screenshot.</desc>
  <defs>

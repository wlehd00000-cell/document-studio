<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Document Studio — collection cover source</title>
<style>
@font-face{font-family:Pretendard;src:url(../../../examples/document-collection/assets/PretendardVariable.woff2);font-weight:100 900}
*{box-sizing:border-box}body{margin:0;background:#f4f1e9;font-family:Pretendard,Arial,sans-serif;color:#183a2d}
.canvas{position:relative;width:1800px;height:1200px;overflow:hidden;background:#f4f1e9}
.art{position:absolute;right:0;top:0;width:650px;height:292px;object-fit:cover;object-position:center 43%}
header{position:absolute;left:56px;top:48px;z-index:1}
.wordmark{font-size:20px;letter-spacing:3.3px;font-weight:700}
h1{font-size:76px;font-weight:620;letter-spacing:-3.3px;line-height:1.03;margin:24px 0 0}
.sub{font-size:24px;margin-top:18px;color:#5c715f}
.stage{position:absolute;left:0;right:0;top:304px;height:812px;background:#e4e9df}
.sample{position:absolute;top:338px}.label{height:40px;font-size:22px;font-weight:550;display:flex;gap:16px;align-items:flex-start;color:#244b39}
.label span{color:#69836a;font-size:17px;padding-top:3px;letter-spacing:1px}
.sample img{display:block;box-shadow:0 8px 28px #183a2d16}
.a{left:56px}.b{left:600px}.a img,.b img{width:500px;height:auto}
.c,.d{left:1154px}.c img,.d img{width:580px;height:326.25px}
.d{top:718.922px}.d .label{height:40px}
footer{position:absolute;left:56px;right:56px;bottom:34px;display:flex;justify-content:space-between;font-size:16px;color:#526c59}
.meta{font-size:15px;letter-spacing:1px}
</style>
</head>
<body>
<div class="canvas">
  <img class="art" src="paper-sculpture.png" alt="Abstract paper sculpture in ivory and forest green">
  <header><div class="wordmark">DOCUMENT STUDIO</div><h1>From brief to<br>business document.</h1><div class="sub">Structure. Writing. Design. Review.</div></header>
  <div class="stage"></div>
  <div class="sample a"><div class="label"><span>01</span>Retail proposal</div><img src="../../../examples/document-collection/png/01-refill-proposal.png" alt="Korean retail pilot proposal"></div>
  <div class="sample b"><div class="label"><span>02</span>Performance report</div><img src="../../../examples/document-collection/png/02-commerce-report.png" alt="Korean ecommerce report"></div>
  <div class="sample c"><div class="label"><span>03</span>Decision comparison</div><img src="../../../examples/document-collection/png/03-onboarding-comparison.png" alt="Korean onboarding comparison"></div>
  <div class="sample d"><div class="label"><span>04</span>Japanese proposal</div><img src="../../../examples/document-collection/png/04-seasonal-menu-ja.png" alt="Japanese seasonal-menu proposal"></div>
  <footer><span>Curated fictional examples · AI-generated concept photos</span><span class="meta">A4 + 16:9 &nbsp; / &nbsp; PNG · PDF · HTML</span></footer>
</div>
</body>
</html>

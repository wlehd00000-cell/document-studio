<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Document Studio: reusable document workflows</title>
  <desc id="desc">A brief moves through research and structure, writing and design, and human review. Approved Company Packs provide reusable writing and layout rules. This is a workflow illustration, not an output benchmark.</desc>
  <rect width="1200" height="420" rx="20" fill="#102f51"/>
  <g font-family="Arial, sans-serif">
    <text x="48" y="54" fill="#f0aa83" font-size="14" font-weight="700" letter-spacing="3">DOCUMENT STUDIO / OPEN SOURCE</text>
    <text x="48" y="111" fill="#fff" font-size="38" font-weight="700">Your workflow, ready for the next document.</text>
    <text x="48" y="146" fill="#b6cbde" font-size="18">Reports · Proposals · Presentations · Optional Korean / Japanese editing</text>
    <g fill="#f4f8fc">
      <rect x="48" y="190" width="230" height="100" rx="10"/>
      <rect x="340" y="190" width="230" height="100" rx="10"/>
      <rect x="632" y="190" width="230" height="100" rx="10"/>
      <rect x="924" y="190" width="230" height="100" rx="10"/>
    </g>
    <g fill="#102f51" font-size="19" font-weight="700" text-anchor="middle">
      <text x="163" y="227">01 / BRIEF</text>
      <text x="455" y="227">02 / EVIDENCE</text>
      <text x="747" y="227">03 / COMPOSE</text>
      <text x="1039" y="227">04 / REVIEW</text>
    </g>
    <g fill="#45627b" font-size="16" text-anchor="middle">
      <text x="163" y="260">Reader + decision</text>
      <text x="455" y="260">Research + structure</text>
      <text x="747" y="260">Writing + design</text>
      <text x="1039" y="260">Checks + human judgment</text>
    </g>
    <g stroke="#f0aa83" stroke-width="3" fill="none">
      <path d="M290 240H326m-8-8 8 8-8 8M582 240H618m-8-8 8 8-8 8M874 240H910m-8-8 8 8-8 8"/>
    </g>
    <rect x="48" y="320" width="1106" height="50" rx="8" fill="#244564"/>
    <text x="68" y="351" fill="#fff" font-size="17"><tspan font-weight="700" fill="#f0aa83">APPROVED COMPANY PACKS</tspan><tspan dx="18">Reusable terminology, writing conventions and layout rules</tspan></text>
    <text x="48" y="399" fill="#b6cbde" font-size="12">Workflow illustration · Experimental alpha · Document authoring and visual checks require your agent and runtime</text>
  </g>
</svg>
